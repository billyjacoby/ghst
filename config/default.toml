# Default ghst configuration
# Copy to ~/.config/ghst/config.toml and edit as needed.

[provider]
# Easiest to set with `ghst provider`, which also remembers each provider's
# settings under [profiles.*].
# "openai" (OpenAI or any OpenAI-compatible local server), "anthropic", or
# "chatgpt" (your ChatGPT plan; sign in with `ghst login`)
name = "openai"

# API key (or set GHST_API_KEY environment variable)
# api_key = "..."

# Server URL. Recommended: oMLX on this Mac. Leave out for OpenAI itself.
api_base_url = "http://localhost:8000/v1"

# Model for Cmd+I (English to command) and history search
model = "Qwen3-Coder-30B-A3B-Instruct-8bit"

# Fast model for ghost text. A *base* coder model (not -Instruct) gets
# fill-in-the-middle prompts and is the fastest good option.
# Defaults to the value of `model` if not set.
autocomplete_model = "Qwen2.5-Coder-1.5B-4bit"

[ui]
# Base debounce delay (ms) before triggering autocomplete
autocomplete_delay_ms = 100

# Reduced debounce delay (ms) when buffer length >= autocomplete_delay_threshold
autocomplete_delay_short_ms = 50

# Character count at which debounce switches to autocomplete_delay_short_ms
autocomplete_delay_threshold = 8

# Minimum characters typed before autocomplete fires
autocomplete_min_chars = 2

# Where past commands that start with what you typed come from:
# "auto" (atuin if installed, else zsh history), "atuin", "zsh" or "off"
history_source = "auto"

# How many of those past commands to use
history_match_limit = 5

# Show the best past command as ghost text at once, before the model answers
instant_history = true

# Longest model reply for ghost text, in tokens
autocomplete_max_tokens = 32

# Give up on a ghost-text model request after this long
autocomplete_timeout_ms = 3000

# Most model requests per minute
rate_limit_rpm = 240

# Hotkeys for the natural language command prompt (space-separated).
# ^[[105;9u is Cmd+I once the terminal is mapped to send it (see README).
nl_hotkey = "^G ^[[105;9u"

# Hotkey for natural language history search. Empty = unbound, which leaves
# Ctrl+R to atuin or zsh; set to "^R" to take Ctrl+R over.
history_search_hotkey = ""

# Hotkey for in-shell cheat sheet
cheat_sheet_hotkey = "^_"

# Max history entries to send to LLM for history search
history_search_limit = 500

# Enable/disable error correction (suggest fixes for failed commands)
error_correction = true

# Enable/disable proactive suggestions (suggest next command from terminal output)
proactive_suggestions = true

# Max lines of terminal output to capture for proactive suggestions
proactive_output_lines = 50

# Commands to skip output capture for (interactive programs)
proactive_capture_blocklist = [
    "vim", "nvim", "vi", "nano", "emacs", "pico",
    "less", "more", "most", "bat",
    "top", "htop", "btop", "glances",
    "tmux", "screen",
    "ssh", "mosh",
    "python", "ipython", "node", "irb", "ghci",
    "fzf", "sk",
    "man", "info",
    "watch",
]
